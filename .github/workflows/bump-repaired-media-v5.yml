name: Bump repaired media cache v5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-repaired-media-v5.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bump cache and remove helper
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('updates-2026-08-15.js?v=20260815-4','updates-2026-08-15.js?v=20260815-5')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "ChatGPT Website Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/bump-repaired-media-v5.yml
          git commit -m "Refresh repaired 15 Aug media cache v5"
          git push origin main
