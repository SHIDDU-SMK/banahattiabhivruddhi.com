name: Cache bust 15 Aug media
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-bust-15aug.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh 15 Aug script URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'updates-2026-08-15\.js(?:\?v=[^"\']+)?', 'updates-2026-08-15.js?v=20260815-5', s)
          p.write_text(s)
          PY
          git config user.name 'ChatGPT Website Update'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Refresh 15 Aug media cache'
          git push origin main
