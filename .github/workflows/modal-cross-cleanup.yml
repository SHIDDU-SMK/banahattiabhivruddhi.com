name: Apply simple modal close icon

on:
  push:
    paths:
      - '.github/workflows/modal-cross-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Simplify close control and refresh CSS cache
        shell: bash
        run: |
          cat >> responsive-2026-08-14.css <<'CSS'

          /* Simple post modal close icon — 20 Aug 2026 */
          .modal-close {
            position: sticky !important;
            top: 8px !important;
            z-index: 80 !important;
            display: block !important;
            width: 34px !important;
            height: 34px !important;
            margin: 8px 10px -42px auto !important;
            padding: 0 !important;
            border: 0 !important;
            border-radius: 0 !important;
            background: transparent !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            color: #fff !important;
            font: 300 2rem/34px Inter, Arial, sans-serif !important;
            text-align: center !important;
            text-shadow: 0 1px 5px rgba(0,0,0,.65);
            transform: none !important;
          }
          .modal-close:hover,
          .modal-close:active {
            background: transparent !important;
            color: #fff !important;
            transform: scale(1.08) !important;
          }
          .modal-close:focus-visible {
            outline: 2px solid rgba(255,255,255,.9) !important;
            outline-offset: 2px !important;
          }
          @media (max-width: 700px) {
            .modal-close {
              top: 6px !important;
              width: 32px !important;
              height: 32px !important;
              margin: 6px 8px -38px auto !important;
              font-size: 1.9rem !important;
              line-height: 32px !important;
            }
          }
          CSS

          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('responsive-2026-08-14.css"', 'responsive-2026-08-14.css?v=20260820-5"')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change
        shell: bash
        run: |
          git config user.name "ChatGPT Website Update"
          git config user.email "actions@users.noreply.github.com"
          git add responsive-2026-08-14.css index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use simple cross for post modal close"
          git push
