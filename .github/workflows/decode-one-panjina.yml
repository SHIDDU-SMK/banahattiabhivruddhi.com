name: Decode one staged WebP image

on:
  push:
    branches: [main]
    paths:
      - 'staging/*.b64'
      - '.github/workflows/decode-one-panjina.yml'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Decode exactly one staged WebP
        run: |
          set -euo pipefail
          file=$(find staging -maxdepth 1 -type f -name '*.b64' | sort | head -n 1)
          test -n "$file"
          base=$(basename "$file" .b64)
          mkdir -p assets
          base64 -d "$file" > "assets/${base}.webp"
          file "assets/${base}.webp" | grep -qi 'webp'
          echo "Validated assets/${base}.webp ($(stat -c%s "assets/${base}.webp") bytes)"
          git config user.name "ChatGPT Website Update"
          git config user.email "actions@users.noreply.github.com"
          git add "assets/${base}.webp"
          git rm "$file"
          git commit -m "Add ${base} WebP"
          git push origin main
