name: Fix 15 Aug loader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-15aug-loader.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Explicitly load dated update scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = '<script src="updates-2026-08-14.js" defer></script>'
          new = '<script src="updates-2026-08-14.js?v=20260815-1" defer></script>\n<script src="updates-2026-08-15.js?v=20260815-1" defer></script>'
          if old in text:
              text = text.replace(old, new, 1)
          elif 'updates-2026-08-15.js' not in text:
              text = text.replace('</body>', new + '\n</body>', 1)
          index.write_text(text, encoding='utf-8')

          p = Path('updates-2026-08-14.js')
          js = p.read_text(encoding='utf-8')
          marker = '\n// Load the 15 August dated update without changing the main HTML file.'
          if marker in js:
              js = js.split(marker, 1)[0].rstrip() + '\n'
              p.write_text(js, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "ChatGPT Website Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html updates-2026-08-14.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix 15 August update loader"
            git push origin main
          fi
