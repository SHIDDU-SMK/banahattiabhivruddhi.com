name: Process staged website media

on:
  push:
    branches: [main]
    paths:
      - 'staging/**/*.b64'
      - 'staging/**/.ready'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staged-media-main
  cancel-in-progress: false

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decode all staged media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          mapfile -t files < <(find staging -type f -name '*.b64' -print | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No staged media found.'
            exit 0
          fi

          for f in "${files[@]}"; do
            base=$(basename "$f" .b64)
            out="assets/$base"
            base64 -d "$f" > "$out"
            file "$out"
            git add "$out"
            git rm "$f"
          done

          while IFS= read -r marker; do
            git rm "$marker"
          done < <(find staging -type f -name '.ready' -print)

          git config user.name 'ChatGPT Website Update'
          git config user.email 'actions@users.noreply.github.com'

          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi

          git commit -m 'Process staged website media'
          git push origin main
