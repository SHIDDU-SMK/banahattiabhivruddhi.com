name: Process staged website media

on:
  push:
    branches: [main]
    paths:
      - 'staging/**/*.b64'
      - 'staging/**/.ready'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staged-media-main
  cancel-in-progress: false

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decode all staged media
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p assets
          mapfile -t files < <(find staging -type f -name '*.b64' -print | sort)

          if [ ${#files[@]} -eq 0 ]; then
            echo 'No staged media found.'
            exit 0
          fi

          failed=0

          for f in "${files[@]}"; do
            base=$(basename "$f" .b64)
            out="assets/$base"
            tmp="${out}.tmp"
            echo "Processing $f -> $out"

            if ! base64 -d "$f" > "$tmp" 2>/dev/null; then
              echo "::error file=$f::Invalid base64; leaving file in staging"
              rm -f "$tmp"
              failed=1
              continue
            fi

            if [ "$(head -c 4 "$tmp")" != "RIFF" ] || [ "$(dd if="$tmp" bs=1 skip=8 count=4 2>/dev/null)" != "WEBP" ]; then
              echo "::error file=$f::Decoded file is not a valid WebP container; leaving file in staging"
              rm -f "$tmp"
              failed=1
              continue
            fi

            mv "$tmp" "$out"
            file "$out"
            git add "$out"
            git rm "$f"
          done

          if [ $failed -eq 0 ]; then
            while IFS= read -r marker; do
              git rm "$marker"
            done < <(find staging -type f -name '.ready' -print)
          else
            echo 'Some staged files failed; valid files will still be committed.'
          fi

          git config user.name 'ChatGPT Website Update'
          git config user.email 'actions@users.noreply.github.com'

          if ! git diff --cached --quiet; then
            git commit -m 'Process valid staged website media'
            git push origin main
          else
            echo 'Nothing valid to commit.'
          fi

          if [ $failed -ne 0 ]; then
            exit 1
          fi
