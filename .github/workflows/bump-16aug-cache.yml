name: Bump 16 Aug cache
on:
  push:
    paths:
      - 'staging/bump-16aug-cache.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Force latest 16 Aug script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('updates-2026-08-16.js?v=20260816-6', 'updates-2026-08-16.js?v=20260816-7')
          p.write_text(s)
          PY
          git config user.name "ChatGPT Website Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh website after removing second 16 Aug newspaper" || exit 0
          git push origin main
