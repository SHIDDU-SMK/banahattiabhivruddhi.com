name: Install 25 August newspaper coverage

# The 25 August images are already committed to the repository and are
# referenced by daily-status.js. Keep this workflow manual-only so it does
# not create failing runs on unrelated pushes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify 25 August newspaper assets
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            assets/news-2026-08-25-01.webp \
            assets/news-2026-08-25-02.webp \
            assets/news-2026-08-25-03.webp \
            assets/news-2026-08-25-05.webp \
            assets/news-2026-08-25-06.webp \
            assets/news-2026-08-25-07.webp
          do
            test -s "$f"
            echo "verified $f"
          done
          grep -q "const NEWS25" daily-status.js
