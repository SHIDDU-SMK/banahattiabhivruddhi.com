name: Refresh repaired media cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-repaired-media.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bump media script cache and remove helper
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('updates-2026-08-15.js?v=20260815-2', 'updates-2026-08-15.js?v=20260815-3')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "ChatGPT Website Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/refresh-repaired-media.yml
          git commit -m "Refresh repaired 15 Aug media"
          git push origin main
