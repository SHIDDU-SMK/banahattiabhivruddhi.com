name: Install 24 August newspaper gallery

on:
  push:
    paths:
      - '.github/workflows/install-news-2026-08-24.yml'
      - 'scripts/install_news24.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run installer
        run: python3 scripts/install_news24.py

      - name: Commit website update
        run: |
          git config user.name "ChatGPT Website Update"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add 24 August gallery and repair recent news"
            git push origin main
          fi
