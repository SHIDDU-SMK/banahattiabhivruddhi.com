name: Bump Panjina cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-panjina-cache.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Cache bust 15 August update and clean helper
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('updates-2026-08-15.js?v=20260815-1', 'updates-2026-08-15.js?v=20260815-2')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "ChatGPT Website Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/bump-panjina-cache.yml
          git commit -m "Refresh Panjina gallery assets"
          git push origin main
