name: Repair recent newspaper galleries

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-news-23-26.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rebuild 23 August image and refresh cache
        shell: bash
        run: |
          set -euo pipefail
          cat assets/news-2026-08-23-01.part0 assets/news-2026-08-23-01.part1 assets/news-2026-08-23-01.part2 assets/news-2026-08-23-01.part3 assets/news-2026-08-23-01.part4 assets/news-2026-08-23-01.part5 | tr -d '\r\n ' | base64 --decode > assets/news-2026-08-23-01.webp
          file assets/news-2026-08-23-01.webp

          python - <<'PY'
          from pathlib import Path
          p = Path('daily-status.js')
          s = p.read_text(encoding='utf-8')
          start = s.index("  const NEWS23_PARTS = [")
          end = s.index("  let news23MediaUrl = '';", start)
          replacement = "  const NEWS23 = 'assets/news-2026-08-23-01.webp?v=20260826-4';\n"
          s = s[:start] + replacement + s[end + len("  let news23MediaUrl = '';\n"):]
          ls = s.index('  async function loadNews23MediaUrl() {')
          le = s.index('  function sync21AugPost()', ls)
          s = s[:ls] + s[le:]
          s = s.replace('function sync23AugPost(mediaUrl)', 'function sync23AugPost()')
          s = s.replace("mediaKind: 'image', mediaUrls: [mediaUrl], mediaUrl, link: '', local: false, createdAt: 23", "mediaKind: 'image', mediaUrls: [NEWS23], mediaUrl: NEWS23, link: NEWS23, local: false, createdAt: 23")
          old = """    try {\n      const mediaUrl = await loadNews23MediaUrl();\n      sync23AugPost(mediaUrl);\n    } catch (error) {\n      console.error('Could not load 23 August newspaper cutting:', error);\n    }\n\n"""
          s = s.replace(old, "    sync23AugPost();\n")
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          import re
          s = re.sub(r'daily-status\.js\?v=[0-9-]+', 'daily-status.js?v=20260826-4', s)
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/news-2026-08-23-01.webp daily-status.js index.html
          git commit -m "Fix 23 Aug image and refresh 25-26 galleries"
          git push origin main
