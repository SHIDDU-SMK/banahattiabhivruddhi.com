name: One-time ticker cache refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-fix-20260830.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh update script cache reference
        run: |
          set -e
          sed -i 's#updates-2026-08-28.js?v=20260828-2#updates-2026-08-28.js?v=20260830-1#' index.html
          git config user.name 'ChatGPT Website Update'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh ticker fix cache version'
          git push origin main
